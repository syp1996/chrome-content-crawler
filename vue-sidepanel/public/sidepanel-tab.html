<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Sidepanel</title>
  <!-- 加载manifest以获取扩展资源路径 -->
  <link rel="manifest" href="manifest.json">
  <!-- 预加载关键资源 -->
  <link rel="preload" href="<%= BASE_URL %>sidepanel-tab.css" as="style">
  <link rel="preload" href="<%= BASE_URL %>sidepanel-tab.js" as="script">
</head>
<body>
  <div id="app"></div>
  <!-- 内置的加载状态 -->
  <div id="loading" style="
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f5f5;
    z-index: 9999;
  ">
    <div style="text-align: center;">
      <div style="
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #2196F3;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      "></div>
      <p>Loading Tab Sidepanel...</p>
    </div>
  </div>
  <script>
    // 隐藏加载状态当应用挂载后
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loading').style.display = 'none';
      }, 500);
    });
  </script>
  <!-- 内置的CSS动画 -->
  <style>
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</body>
</html>
